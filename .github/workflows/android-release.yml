name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ark-theater-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/ark-theater-release.jks
          EOF

      - name: Create private runtime configuration
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WYZIE_SUBS_API_KEY: ${{ secrets.WYZIE_SUBS_API_KEY }}
        run: |
          test -n "$TMDB_API_KEY"
          cat > .env <<EOF
          TMDB_API_KEY=$TMDB_API_KEY
          WYZIE_SUBS_API_KEY=$WYZIE_SUBS_API_KEY
          SCRAPER_BASE_URL=https://arkscraper.duckdns.org
          SHARED_WATCHLIST_BASE_URL=https://arkscraper.duckdns.org
          EOF

      - name: Build signed APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter pub get
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk ark-theater.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ark-theater.apk
