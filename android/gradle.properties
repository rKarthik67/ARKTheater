org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# media_kit_libs_android_video's own build.gradle downloads native mpv
# jars straight from GitHub releases at build time (not through Gradle's
# normal dependency cache), and Gradle's default HTTP timeouts are too
# short for some networks/ISPs to complete that download, failing with
# "Connection timed out: connect" even though the file is reachable
# (curl/browser succeed fine). Raising the timeout gives it enough room
# to finish instead.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
