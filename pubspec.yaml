name: ark_theater
description: >
  ARKTheater - a movie & TV streaming app that resolves ad-free direct video
  sources via ARKVideoScrapper and plays them natively. Targets mobile,
  tablet, desktop, macOS and iPadOS from a single Flutter codebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0
  # Used by lib/video_providers/ (ported from flixquest's scraper client
  # pattern) to talk to ARKVideoScrapper's /api/v2 endpoints and to the
  # direct VixSrc fallback provider - kept as `http` rather than `dio`
  # to match upstream's client code as closely as possible.
  http: ^1.2.2

  # Env config (TMDB key, scraper base url) without hardcoding secrets
  flutter_dotenv: ^5.2.1

  # State management (simple, no codegen)
  provider: ^6.1.2

  # Video playback: two engines, split by platform - PlayerScreen picks
  # between them at runtime (see lib/screens/player_screen.dart).
  #
  # - better_player_plus (Android/iOS): wraps ExoPlayer/AVPlayer, the exact
  #   same engine flixquest itself uses. Its native HTTP source handling
  #   (adaptive retry, chunked seeking, malformed-range recovery) is
  #   meaningfully more resilient against the flaky scraped CDNs this app
  #   plays from than libmpv is on Android - which is the actual gap behind
  #   "seeking hangs/restarts" reports on mobile. Pinned to 1.0.8 (not the
  #   newest release) because newer versions raise the minimum Dart/Flutter
  #   SDK past what this project targets.
  # - media_kit (Windows/macOS/Linux): better_player_plus has no desktop
  #   support at all, so desktop keeps the engine that actually runs there.
  better_player_plus: 1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # video_player (macOS only): its video_player_avfoundation backend talks
  # to Apple's native AVPlayer/AVFoundation - the same engine iPad already
  # uses via better_player_plus - used by MacosPlayerScreen specifically
  # because media_kit/mpv was found to hang indefinitely seeking on some
  # scraped CDNs that better_player_plus/AVPlayer handle fine.
  video_player: ^2.9.2

  # In-app browser used as a fallback when native stream extraction fails
  # or a resolved link won't play (short-lived/single-use CDN tokens,
  # player fingerprint mismatches). Renders the real embed page - so
  # playback works exactly as it does on the source site - while we block
  # popups and known ad-host navigations from inside it.
  flutter_inappwebview: ^6.1.5

  # Images
  cached_network_image: ^3.4.1
  # Renders the Wikimedia Commons .svg logos in lib/models/platform_filter.dart
  # for the Platforms screen (OTT platforms / production houses).
  flutter_svg: ^2.0.10+1

  # Local persistence for watchlist / continue-watching
  shared_preferences: ^2.3.3

  # Icons
  cupertino_icons: ^1.0.8

  # Fullscreen / orientation control while a video is playing
  wakelock_plus: ^1.2.10

  # Temp-file staging for the splash screen's chime sound (see
  # lib/screens/splash_screen.dart) - already present transitively, listed
  # directly since app code imports it.
  path_provider: ^2.1.5

  # Watchlist export/import (Settings > Library > Export/Import
  # Watchlist) - share_plus opens the native share sheet (AirDrop,
  # Messages, Save to Files, etc.) so an exported watchlist.json can
  # reach another device; file_picker opens the native file-open dialog
  # so an imported .json can be read back in from wherever the user
  # saved/received it.
  share_plus: ^7.2.2
  # Must stay >=8: file_picker 6.x/7.x still ship a v1-embedding
  # `registerWith(PluginRegistry.Registrar)` in FilePickerPlugin.java, and
  # Flutter 3.29 deleted the v1 embedding outright - so on Flutter 3.35 the
  # plugin fails to compile with "cannot find symbol: class Registrar"
  # before any of this app's own code is even reached. The upper bound is
  # deliberately loose so pub resolves the newest it can; nothing in
  # services/watchlist_backup_service.dart uses API that changed across
  # those majors (pickFiles/FileType.custom/allowedExtensions/withData and
  # PlatformFile.bytes/.path are identical from 6.x through 10.x).
  file_picker: '>=8.0.0 <11.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/audio/
  # Instrument Serif (display/headings) + Space Grotesk (body/UI), matching
  # reflixmovies.vercel.app's font pairing - bundled locally rather than
  # fetched at runtime (the google_fonts package's default behavior), since
  # a slow/blocked connection to fonts.gstatic.com on first launch would
  # otherwise silently fall back to the system font with no error.
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    # Added for the Settings > Fonts & Colors customization feature - free
    # stand-ins for the "Casko Luxury Demo" / "Bright Pasqia DEMO" fonts
    # requested (see core/app_fonts.dart's doc comment for why substitutes).
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    # Second wave of user-selectable families for Settings > Fonts &
    # Colors. All OFL-licensed Google Fonts, bundled rather than fetched at
    # runtime for the same reason as every family above (see
    # core/theme.dart): a runtime fetch fails silently into a fallback font.
    # Variable (single-file) families list the same asset per weight, the
    # same way Space Grotesk already does.
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
          weight: 700
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 700
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 500
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Great Vibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
    # Third wave: well-regarded, OFL-licensed families for the expanded
    # Settings > Fonts & Colors catalog. Kept local for reliable offline UI.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Variable.ttf
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Variable.ttf
    - family: Josefin Sans
      fonts:
        - asset: assets/fonts/JosefinSans-Variable.ttf
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Variable.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
